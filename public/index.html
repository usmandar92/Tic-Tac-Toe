<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudways vs. Hostinger — Tic-Tac-Toe</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="masthead">
    <h1>Cloudways <span class="vs">vs.</span> Hostinger</h1>
    <p class="subtitle">the classic three-in-a-row rivalry</p>
  </header>

  <main class="wrap">

    <div class="legend">
      <div class="legend-item">
        <span class="mark mark-x" aria-hidden="true">&times;</span>
        <span class="legend-text">Cloudways</span>
      </div>
      <div class="legend-item">
        <span class="mark mark-o" aria-hidden="true">&#9675;</span>
        <span class="legend-text">Hostinger</span>
      </div>
    </div>

    <div class="scoreboard">
      <div class="score score-x">
        <span class="score-label">Cloudways</span>
        <span class="score-value" id="scoreX">0</span>
      </div>
      <div class="score score-draw">
        <span class="score-label">Draws</span>
        <span class="score-value" id="scoreDraw">0</span>
      </div>
      <div class="score score-o">
        <span class="score-label">Hostinger</span>
        <span class="score-value" id="scoreO">0</span>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite">Cloudways goes first</p>

    <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board">
      <button class="cell" data-index="0" role="gridcell" aria-label="Row 1, column 1, empty"></button>
      <button class="cell" data-index="1" role="gridcell" aria-label="Row 1, column 2, empty"></button>
      <button class="cell" data-index="2" role="gridcell" aria-label="Row 1, column 3, empty"></button>
      <button class="cell" data-index="3" role="gridcell" aria-label="Row 2, column 1, empty"></button>
      <button class="cell" data-index="4" role="gridcell" aria-label="Row 2, column 2, empty"></button>
      <button class="cell" data-index="5" role="gridcell" aria-label="Row 2, column 3, empty"></button>
      <button class="cell" data-index="6" role="gridcell" aria-label="Row 3, column 1, empty"></button>
      <button class="cell" data-index="7" role="gridcell" aria-label="Row 3, column 2, empty"></button>
      <button class="cell" data-index="8" role="gridcell" aria-label="Row 3, column 3, empty"></button>
    </div>

    <button class="reset" id="resetBtn">New round</button>

  </main>

  <footer class="wrap">
    A fan-made mini game. Cloudways and Hostinger names belong to their respective owners; marks shown here are stylized, not their official logos.
  </footer>

  <script src="/js/game.js"></script>
</body>
</html>
